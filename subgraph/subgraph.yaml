specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: NihRouter
    network: mezo-testnet
    source:
      address: "0xbeb23b459819b74F60699cE2FEA35B17266F36c5"
      abi: NihRouter
      startBlock: 1
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Tip
        - Account
        - HandleStat
      abis:
        - name: NihRouter
          file: ./abis/NihRouter.json
      eventHandlers:
        - event: Tipped(indexed address,indexed bytes32,indexed address,uint256,uint256,bool,bytes32)
          handler: handleTipped
      file: ./src/mapping.ts
  - kind: ethereum
    name: NihCredit
    network: mezo-testnet
    source:
      address: "0x9857aF25fFa558C382AbB916803Ee441502b0F8D"
      abi: NihCredit
      startBlock: 1
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Loan
      abis:
        - name: NihCredit
          file: ./abis/NihCredit.json
      eventHandlers:
        - event: LoanOpened(indexed address,uint256,uint256)
          handler: handleLoanOpened
        - event: LoanRepaid(indexed address,uint256,uint256)
          handler: handleLoanRepaid
      file: ./src/mapping.ts
  - kind: ethereum
    name: NihStream
    network: mezo-testnet
    source:
      address: "0xBcaaD11EAF61fCf239837C403169Ec380bf36A37"
      abi: NihStream
      startBlock: 1
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - StreamRecord
      abis:
        - name: NihStream
          file: ./abis/NihStream.json
      eventHandlers:
        - event: StreamCreated(indexed uint256,indexed address,indexed address,uint256,uint64,uint64)
          handler: handleStreamCreated
        - event: StreamWithdrawn(indexed uint256,indexed address,uint256)
          handler: handleStreamWithdrawn
        - event: StreamCancelled(indexed uint256,uint256,uint256)
          handler: handleStreamCancelled
      file: ./src/mapping.ts
