specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: NihRouter
    network: mezo-testnet
    source:
      address: "0x68437B812419B8EEE240eC6528f43d111Dd348D3"
      abi: NihRouter
      startBlock: 1
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Tip
        - Account
        - HandleStat
      abis:
        - name: NihRouter
          file: ./abis/NihRouter.json
      eventHandlers:
        - event: Tipped(indexed address,indexed bytes32,indexed address,uint256,uint256,bool,bytes32)
          handler: handleTipped
      file: ./src/mapping.ts
  - kind: ethereum
    name: NihCredit
    network: mezo-testnet
    source:
      address: "0x913E736B1dba8a4f3bF5953800248Ac89C18ec82"
      abi: NihCredit
      startBlock: 1
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Loan
      abis:
        - name: NihCredit
          file: ./abis/NihCredit.json
      eventHandlers:
        - event: LoanOpened(indexed address,uint256,uint256)
          handler: handleLoanOpened
        - event: LoanRepaid(indexed address,uint256,uint256)
          handler: handleLoanRepaid
      file: ./src/mapping.ts
