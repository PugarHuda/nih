specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: NihRouter
    network: mezo-matsnet
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: NihRouter
      startBlock: 1
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Tip
        - Account
        - HandleStat
      abis:
        - name: NihRouter
          file: ./abis/NihRouter.json
      eventHandlers:
        - event: Tipped(indexed address,indexed bytes32,indexed address,uint256,uint256,bool,bytes32)
          handler: handleTipped
      file: ./src/mapping.ts
  - kind: ethereum
    name: NihCredit
    network: mezo-matsnet
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: NihCredit
      startBlock: 1
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Loan
      abis:
        - name: NihCredit
          file: ./abis/NihCredit.json
      eventHandlers:
        - event: LoanOpened(indexed address,uint256,uint256)
          handler: handleLoanOpened
        - event: LoanRepaid(indexed address,uint256,uint256)
          handler: handleLoanRepaid
      file: ./src/mapping.ts
