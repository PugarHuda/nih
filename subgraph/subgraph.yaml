specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: NihRouter
    network: mezo-testnet
    source:
      address: "0x67Fb6f01C35D4793b952C9BFE606c0B7Cb1F7c15"
      abi: NihRouter
      startBlock: 1
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Tip
        - Account
        - HandleStat
      abis:
        - name: NihRouter
          file: ./abis/NihRouter.json
      eventHandlers:
        - event: Tipped(indexed address,indexed bytes32,indexed address,uint256,uint256,bool,bytes32)
          handler: handleTipped
      file: ./src/mapping.ts
  - kind: ethereum
    name: NihCredit
    network: mezo-testnet
    source:
      address: "0x256f577DAf3354156f39a77606B6e4eDc8Fd762c"
      abi: NihCredit
      startBlock: 1
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Loan
      abis:
        - name: NihCredit
          file: ./abis/NihCredit.json
      eventHandlers:
        - event: LoanOpened(indexed address,uint256,uint256)
          handler: handleLoanOpened
        - event: LoanRepaid(indexed address,uint256,uint256)
          handler: handleLoanRepaid
      file: ./src/mapping.ts
  - kind: ethereum
    name: NihStream
    network: mezo-testnet
    source:
      address: "0x28364eF04EF75e77B28553Df47845cf7dB6fD32d"
      abi: NihStream
      startBlock: 1
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - StreamRecord
      abis:
        - name: NihStream
          file: ./abis/NihStream.json
      eventHandlers:
        - event: StreamCreated(indexed uint256,indexed address,indexed address,uint256,uint64,uint64)
          handler: handleStreamCreated
        - event: StreamWithdrawn(indexed uint256,indexed address,uint256)
          handler: handleStreamWithdrawn
        - event: StreamCancelled(indexed uint256,uint256,uint256)
          handler: handleStreamCancelled
      file: ./src/mapping.ts
